name: Tag v0.1.5
on:
  push:
    branches: [main]
    paths: [".github/workflows/tag-015.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: 'refs/tags/v0.1.5', sha: context.sha
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

name: Tag v0.1.0 preview
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tag-preview.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.1.0 tag when absent
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/tags/v0.1.0',
                sha: context.sha
              });
              core.info('Created v0.1.0');
            } catch (error) {
              if (error.status === 422) {
                core.info('Tag v0.1.0 already exists');
              } else {
                throw error;
              }
            }
